# Atualização de dependências (SQ-11): actions fixadas por SHA, pacotes NuGet e imagens Docker.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directories:
      - /src/*
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
