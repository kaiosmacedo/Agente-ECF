# Atualização de dependências (SQ-11): actions fixadas por SHA, pacotes NuGet e imagens Docker.
# Pausado desde 2026-11-23, com o estado congelado (docs/roteiro.md): open-pull-requests-limit: 0 não abre PR de versão.
# As atualizações de segurança do Dependabot, quando ligadas no repositório, não dependem deste limite. Para retomar, remova as linhas do limite.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directories:
      - /src/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
